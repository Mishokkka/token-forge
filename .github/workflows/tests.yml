name: Offline regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-base.txt
      - name: Run image and CLI regression tests
        env:
          TOKENFORGE_TEST_REAL_REGISTRY: '1'
        run: python -m unittest discover -v

  install-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installer imports (no model download)
        run: python -c "import PIL, rembg, onnxruntime, tkinterdnd2, tkinter; print('Imports OK')"
