name: Offline regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-base.txt
      - name: Run image and CLI regression tests
        run: python diagnostics_tests.py

  install-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify interpreter and Tcl prerequisites
        run: python python_compat.py
      - name: Verify installer imports (no model download)
        run: python -c "import PIL, rembg, onnxruntime, tkinterdnd2, tkinter; print('Imports OK')"
